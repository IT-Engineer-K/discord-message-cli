[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-message-cli"
version = "0.3.0"
description = "Discord channel/thread messaging, reply polling, and aggregation CLI and Python library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
discord-msg = "discord_msg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
